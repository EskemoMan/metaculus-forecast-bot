name: Forecast on new tournament questions

on:
  # Primary trigger: an external scheduler (cron-job.org) calls workflow_dispatch every 10 minutes,
  # because GitHub's own cron has been firing only a few times a day.
  workflow_dispatch:
  # Backup trigger. Every run skips questions it has already forecast, so overlap is harmless.
  schedule:
    - cron: "7,27,47 * * * *"

# One run at a time; a newer trigger waits for the current run instead of cancelling it.
concurrency:
  group: forecast-bot
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # failure/coverage alerts are posted as a GitHub issue

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Free-tier LLM quotas are per day, so per-model usage is carried between runs.
      - name: Restore daily LLM usage ledger
        uses: actions/cache/restore@v4
        with:
          path: .usage
          key: llm-usage-${{ github.run_id }}
          restore-keys: llm-usage-
      - name: Forecast on open tournament + MiniBench questions
        run: python main.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_MODEL_POOL: ${{ vars.BOT_MODEL_POOL }}
          BOT_SAMPLES: ${{ vars.BOT_SAMPLES }}
          BOT_TIME_BUDGET_MIN: ${{ vars.BOT_TIME_BUDGET_MIN }}
      - name: Save daily LLM usage ledger
        if: always() && hashFiles('.usage/usage.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .usage
          key: llm-usage-${{ github.run_id }}-${{ github.run_attempt }}
